        h('เขตเวลา (บอกพื้นที่คร่าวๆ)', dRows('tz', k => k.replace(/_/g, '/'))),
        h('มาจาก', rowsHTML(st.ref)),
        h('ช่วงเวลาที่เข้า (ชั่วโมง)', ordered(D.hour, [...Array(24)].map((_, i) => String(i).padStart(2, '0')), k => k + ':00')),
        h('วันในสัปดาห์', ordered(D.dow, ['0', '1', '2', '3', '4', '5', '6'], k => days[+k]))
      ]),
      grp('การใช้งาน', [
        h('อยู่หน้าเว็บนานแค่ไหน', stayRows),
        h('เลื่อนไปถึงส่วนไหน', dRows('sec')),
        h('เพลงที่ถูกกดเล่น', dRows('music'))
      ])
    ].join('');
  }
  async function loadStats() {
    const box = $('#opStats');
    if (!box) return;
    if (!hasFB) { box.textContent = 'ยังไม่ได้ตั้งค่า Firebase จึงยังไม่มีสถิติ'; return; }
    box.textContent = 'กำลังโหลดสถิติ…';
    try {
      const t = await getToken();
      const r = await db('stats', { token: t });
      if (!r.ok) throw new Error('read');
      const st = (await r.json()) || {};
      lastSt = st;
      const o = st.offset && typeof st.offset === 'object' ? st.offset : {};
      S.off = { views: +o.views || 0, likes: +o.likes || 0, online: +o.online || 0 };
      real = { views: st.views || 0, likes: st.likes || 0, online: S.online };
      drawStats();
      const adjHTML = [['views', 'เข้าชม'], ['likes', 'หัวใจ'], ['online', 'ออนไลน์']].map(([k, n]) => `
        <div class="op-adj"><span class="t">${n}<small>จริง ${real[k] === undefined ? '-' : fmt(real[k])}</small></span>
          <input type="number" step="1" data-off="${k}" value="${S.off[k]}">
          <span class="sh" data-sh="${k}">แสดง ${real[k] === undefined ? '-' : fmt(Math.max(k === 'online' ? 1 : 0, real[k] + S.off[k]))}</span></div>`).join('');
      box.innerHTML = `
        <div class="op-nums">
          <div class="op-num"><b>${fmt(real.views)}</b><span>เข้าชม (จริง)</span></div>
          <div class="op-num"><b>${fmt(real.likes)}</b><span>หัวใจ (จริง)</span></div>
          <div class="op-num"><b>${real.online ?? '-'}</b><span>ออนไลน์ (จริง)</span></div>
        </div>
        <div class="op-h">ปรับตัวเลขที่แสดงหน้าเว็บ (ค่าจริงไม่ถูกแตะ)</div>
        ${adjHTML}
        <div class="op-adjbtns"><button data-act="adj-reset">กลับเป็นค่าจริง</button><button data-act="adj-save">บันทึกตัวเลข</button></div>
        <div class="op-h">ผู้เข้าชมรายวัน<span class="op-seg">${[7, 30, 90].map(n => `<button data-act="range" data-n="${n}" class="${n === dailyRange ? 'on' : ''}">${n} วัน</button>`).join('')}</span></div><div id="opDaily">${dailyBlock(st)}</div>
        <div class="op-h">สิ่งที่ถูกกด</div>${rowsHTML(st.clicks, dispKey, 12)}
        ${groupsHTML(st)}`;
    } catch (_) {
      box.textContent = 'โหลดสถิติไม่ได้ (เช็ก Rules หรือกดค้างที่ป้ายเพื่อล็อกอินใหม่)';
    }
  }
  function closePanel() { const el = $('#ownerPanel'); if (el) el.remove(); if (clockSaved) applyClock(clockSaved); applyProfile(SITE.profile); applyTheme(SITE.theme); }
  function openPanel() {
    closePanel();
    let sel = cur.key;
    const el = document.createElement('div');
    el.id = 'ownerPanel';
    el.className = 'op-backdrop';
    el.innerHTML = `
      <div class="op-card" role="dialog" aria-label="แผงเจ้าของ">
        <div class="op-msg" id="opMsg" role="status"></div>
        <div class="op-head"><span>แผงเจ้าของ</span><button data-act="close" aria-label="ปิด">✕</button></div>
        <div class="op-tabs">${[['status', 'สถานะ'], ['content', 'เนื้อหา'], ['msgs', 'ข้อความ'], ['stats', 'สถิติ']].map(([k, l]) => `<button class="op-tab${k === opTab ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
        <div class="op-pane${opTab === 'status' ? ' on' : ''}" data-pane="status">
          <div class="op-sec">
            <div class="op-label">สถานะ</div>
            <div class="op-chips">${presets.map(p => `<button class="op-chip${p.key === sel ? ' on' : ''}" data-key="${esc(p.key)}" style="--c:${p.color}"><i></i>${esc(p.text)}</button>`).join('')}</div>
            <input class="op-input" id="opText" maxlength="40" placeholder="พิมพ์ข้อความสถานะ เช่น กำลังเล่น ROV" value="${esc(cur.text)}">
            <button class="op-save" data-act="save">บันทึกสถานะ</button>
          </div>
          <div class="op-sec" id="opClock"></div>
        </div>
        <div class="op-pane${opTab === 'content' ? ' on' : ''}" data-pane="content"><div id="opContent"></div></div>
        <div class="op-pane${opTab === 'msgs' ? ' on' : ''}" data-pane="msgs">
          <div class="op-sec"><div class="op-label">แชทสด <span id="opChatCount"></span></div><div id="opChat">กำลังโหลด…</div></div>
          <div class="op-sec"><div class="op-label">ข้อความลับ (เห็นเฉพาะคุณ) <span id="opIbCount"></span></div><div id="opInbox">กำลังโหลด…</div></div>
          <div class="op-sec"><div class="op-label">สมุดเยี่ยมชม <span id="opGbCount"></span></div><div id="opGuest">กำลังโหลด…</div></div>
        </div>
        <div class="op-pane${opTab === 'stats' ? ' on' : ''}" data-pane="stats">
          <div class="op-sec"><div class="op-label">สถิติ (เห็นเฉพาะคุณ)</div><div id="opStats"></div></div>
          <button class="op-export" data-act="export">ดาวน์โหลดสำรองสถิติ (.json)</button>
          <button class="op-danger" data-act="reset-stats">ล้างสถิติทั้งหมด (เริ่มนับใหม่)</button>
        </div>
        <div class="op-foot"><button data-act="refresh">รีเฟรชข้อมูล</button><button data-act="logout">ออกจากระบบ</button></div>
      </div>`;
    document.body.appendChild(el);
    const input = $('#opText', el);
    ckDraft = { ...(clockSaved || cleanClock({})) };
    renderClockPanel(el);
    edInit();
    if (opTab === 'content') renderContentPane(el);
    el.addEventListener('click', async e => {
      if (e.target === el) { closePanel(); return; }
      const clItem = e.target.closest('.cl-item');
      if (clItem) {
        const uid = clItem.dataset.chatUid;
        ocOpen = ocOpen === uid ? null : uid;
        if (ocOpen) localStorage.setItem('chatSeen:' + uid, String(Date.now()));
        loadOwnerChat();
        return;
      }
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        opTab = tabBtn.dataset.tab;
        $$('.op-tab', el).forEach(b => b.classList.toggle('on', b === tabBtn));
        $$('.op-pane', el).forEach(p => p.classList.toggle('on', p.dataset.pane === opTab));
        if (opTab === 'content' && !$('#opContent', el).children.length) renderContentPane(el);
        return;
      }
      const ck = e.target.closest('[data-ck]');
      if (ck) {
        const k = ck.dataset.ck, v = ck.dataset.v;
        if (k === 'clear') ckDraft[v] = '';
        else if (v === 'toggle') ckDraft[k] = !ckDraft[k];
        else ckDraft[k] = v;
        ckDraft = cleanClock(ckDraft);
        renderClockPanel(el);
        applyClock(ckDraft);
        return;
      }
      const chip = e.target.closest('.op-chip');
      if (chip) {
        const isDefault = !input.value.trim() || presets.some(p => p.text === input.value.trim());
        sel = chip.dataset.key;
        $$('.op-chip', el).forEach(c => c.classList.toggle('on', c === chip));
        if (isDefault) input.value = find(sel).text;
        return;
      }
      const btn = e.target.closest('[data-act]');
      const act = btn?.dataset.act;
      if (act === 'close') closePanel();
      else if (act === 'refresh') await busy(btn, 'กำลังโหลด…', async () => { await loadStats(); await loadOwnerGuest(); await loadInbox(); await loadOwnerChat(); return true; });
      else if (act && act.startsWith('ed-') && act !== 'ed-save-prof' && act !== 'ed-reset-prof') await editorAct(el, act, btn);
      else if (act === 'ed-save-prof') await saveProfile(btn);
      else if (act === 'ed-reset-prof') {
        ED.profile = { name: BASE.name, tagline: BASE.tagline.replace(/<br\s*\/?>/gi, '\n'), avatar: BASE.avatar };
        ED.theme = cleanTheme({});
        renderContentPane(el);
        applyProfile(cleanProfile(ED.profile));
        applyTheme(cleanTheme(ED.theme));
        panelMsg('โหลดค่าเริ่มต้นแล้ว กดบันทึกเพื่อใช้จริง', 'ok');
      }
      else if (act === 'pp-preview') showPopup(cleanPopup(ED.popup), true);
      else if (act === 'pp-save') await savePopup(btn);
      else if (act === 'chat-send') {
        const uid = btn.dataset.uid;
        const inp = $(`[data-chat-reply="${uid}"]`, el);
        const text = (inp?.value || '').trim().slice(0, 300);
        if (!text) return;
        const ok = await busy(btn, '…', () => chatReply(uid, text));
        if (ok) { if (inp) inp.value = ''; loadOwnerChat(); } else panelMsg(errText(), 'err');
      }
      else if (act === 'ib-del') {
        const id = btn.closest('[data-id]')?.dataset.id;
        const ok = await busy(btn, '…', () => putPath('inbox/' + id, null));
        if (ok) { panelMsg('ลบแล้ว', 'ok'); loadInbox(); } else panelMsg(errText(), 'err');
      }
      else if (act === 'ck-reset') {
        ckDraft = cleanClock({});
        renderClockPanel(el);
        applyClock(ckDraft);
        panelMsg('โหลดค่าเริ่มต้นแล้ว กด "บันทึกนาฬิกา" เพื่อใช้จริง', 'ok');
      }
      else if (act === 'ck-save') {
        const cfg = cleanClock(ckDraft);
        const ok = await busy(btn, 'กำลังบันทึก…', () => putClock(cfg), '✓ บันทึกแล้ว');
        if (ok) panelMsg('บันทึกนาฬิกาแล้ว ทุกคนเห็นเมื่อเปิดหน้าใหม่/ภายใน 1 นาที', 'ok');
        else panelMsg(errText(), 'err');
      }
      else if (act === 'range') {
        dailyRange = +btn.dataset.n || 7;
        $$('.op-seg button', el).forEach(b => b.classList.toggle('on', b === btn));
        const box = $('#opDaily', el);
        if (box && lastSt) box.innerHTML = dailyBlock(lastSt);
      }
      else if (act === 'gb-ok' || act === 'gb-del-p' || act === 'gb-del-a') {
        const id = btn.closest('[data-id]')?.dataset.id;
        const ok = await busy(btn, '…', () => guestAction(act, id));
        if (ok) { panelMsg(act === 'gb-ok' ? 'อนุมัติแล้ว ขึ้นหน้าเว็บทันที' : 'ลบแล้ว', 'ok'); loadOwnerGuest(); loadGuest(); }
        else panelMsg(errText(), 'err');
      }
      else if (act === 'export') {
        if (!lastSt) { panelMsg('ยังไม่มีข้อมูล กดรีเฟรชสถิติก่อน', 'err'); return; }
        const data = { exportedAt: new Date().toISOString(), stats: lastSt, guestbook: { pending: ownerGb.pl, approved: ownerGb.al } };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        a.download = 'link-space-backup-' + new Date().toLocaleDateString('sv-SE') + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        panelMsg('ดาวน์โหลดไฟล์สำรองแล้ว', 'ok');
      }
      else if (act === 'adj-save' || act === 'adj-reset') {
        const vals = { views: 0, likes: 0, online: 0 };
        if (act === 'adj-save') {
          $$('[data-off]', el).forEach(i => { vals[i.dataset.off] = Math.max(-1e9, Math.min(1e9, Math.round(+i.value || 0))); });
        }
        const ok = await busy(btn, 'กำลังบันทึก…', () => putOffset(vals), act === 'adj-save' ? '✓ บันทึกแล้ว' : '✓ เรียบร้อย');
        if (ok) { panelMsg(act === 'adj-save' ? 'บันทึกตัวเลขแล้ว หน้าเว็บแสดงตามที่ตั้งไว้' : 'กลับเป็นค่าจริงแล้ว', 'ok'); loadStats(); }
        else panelMsg(errText(), 'err');
      }
      else if (act === 'reset-stats') {
        if (!confirm('ล้างสถิติทั้งหมด (ยอดชม หัวใจ การกด อุปกรณ์ ฯลฯ) ย้อนกลับไม่ได้ ยืนยัน?')) return;
        if ((prompt('พิมพ์คำว่า ล้าง เพื่อยืนยันอีกครั้ง') || '').trim() !== 'ล้าง') return;
        const ok = await busy(btn, 'กำลังล้าง…', resetStats, '✓ ล้างแล้ว');
        if (ok) { panelMsg('ล้างสถิติแล้ว เริ่มนับใหม่จาก 0 (ตัวปรับตัวเลขยังอยู่)', 'ok'); loadStats(); }
        else panelMsg(errText(), 'err');
      }
      else if (act === 'save') {
        const val = { key: sel, text: input.value.trim().slice(0, 40) || find(sel).text, ts: Date.now() };
        const prev = { ...cur };
        apply(val);
        const ok = await busy(btn, 'กำลังบันทึก…', () => publish(val), '✓ บันทึกแล้ว');
        if (ok) panelMsg('บันทึกสถานะแล้ว ทุกคนเห็นทันที', 'ok');
        else { apply(prev); panelMsg(errText(), 'err'); }
      } else if (act === 'logout') {
        if (!confirm('ออกจากโหมดเจ้าของ?')) return;
        owner = false;
        localStorage.removeItem('fbRefresh');
        localStorage.removeItem('statusOwnerLocal');
        tok = { t: null, exp: 0 };
        closePanel();
        showToast('ออกจากโหมดเจ้าของแล้ว', 'check');
      }
    });
    el.addEventListener('change', async e => {
      const fi = e.target.closest('[data-edfile]');
      if (!fi || !fi.files || !fi.files[0]) return;
      const sc = fi.dataset.edfile, f = fi.dataset.f, kind = fi.dataset.kind;
      const max = kind === 'popup' ? 640 : kind === 'gallery' ? 640 : kind === 'avatar' ? 192 : 96;
      try {
        const url = await resizeImage(fi.files[0], max, kind === 'icon' ? 'image/png' : 'image/jpeg', 0.8);
        if (LIST_DEFS[sc]) {
          const i = +fi.dataset.i;
          ED[sc][i][f] = url;
          ED.open[sc + ':' + i] = true;
          renderList(el, sc);
        } else {
          ED[sc][f] = url;
          const pv = $('.ed-prev', fi.closest('.ed-f'));
          if (pv) pv.innerHTML = imgTag(url);
          if (sc === 'profile') applyProfile(cleanProfile(ED.profile));
        }
        panelMsg('อัปโหลดรูปแล้ว (ย่อให้อัตโนมัติ) กดบันทึกเพื่อใช้จริง', 'ok');
      } catch (_) { panelMsg('อัปโหลดไม่ได้ ลองรูปอื่น (ต้องเป็นไฟล์รูป ไม่เกิน 10MB)', 'err'); }
      fi.value = '';
    });
    el.addEventListener('keydown', e => {
      const cr = e.target.closest('[data-chat-reply]');
      if (cr && e.key === 'Enter') { e.preventDefault(); $(`[data-act="chat-send"][data-uid="${cr.dataset.chatReply}"]`, el)?.click(); }
    });
    el.addEventListener('input', e => {
      const ed = e.target.closest('[data-ed]');
      if (ed && ed.dataset.f && !ed.matches('button')) {
        const sc = ed.dataset.ed, f = ed.dataset.f;
        const val = ed.type === 'checkbox' ? ed.checked : ed.value;
        if (LIST_DEFS[sc]) {
          const i = +ed.dataset.i;
          ED[sc][i][f] = val;
          edUpdateHead(el, sc, i);
        } else {
          ED[sc][f] = val;
          if (sc === 'profile') applyProfile(cleanProfile(ED.profile));
          if (sc === 'theme') applyTheme(cleanTheme(ED.theme));
        }
        return;
      }
      const cr = e.target.closest('[data-chat-reply]');
      // (ใช้ input event เพื่อความสม่ำเสมอ ปล่อยผ่านไป ไม่มีการกระทำ)
      const c = e.target.closest('[data-ckin]');
      if (c) {
        const k = c.dataset.ckin;
        ckDraft[k] = c.type === 'range' ? +c.value : c.value;
        ckDraft = cleanClock(ckDraft);
        ckRefresh(el);
        return;
      }
      const i = e.target.closest('[data-off]');
      if (!i) return;
      const k = i.dataset.off;
      const sh = $(`[data-sh="${k}"]`, el);
      if (sh && real[k] !== undefined) sh.textContent = 'แสดง ' + fmt(Math.max(k === 'online' ? 1 : 0, real[k] + (Math.round(+i.value) || 0)));
    });
    loadStats();
    loadOwnerGuest();
    loadInbox();
    loadOwnerChat();
  }

  // กดค้างที่ป้ายสถานะ = ล็อกอินเจ้าของ, เจ้าของกดสั้น = เปิดแผง
  let timer = null, longFired = false;
  badge.addEventListener('pointerdown', () => {
    longFired = false;
    timer = setTimeout(async () => {
      longFired = true;
      if (!owner) {
        if (hasFB) {
          if (!(await login())) return;
        } else {
          localStorage.setItem('statusOwnerLocal', '1');
          showToast('ยังไม่ได้ตั้งค่า Firebase — เปลี่ยนได้เฉพาะเครื่องนี้', 'star');
        }
        owner = true;
      }
      openPanel();
    }, 700);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => badge.addEventListener(ev, () => clearTimeout(timer)));
  badge.addEventListener('contextmenu', e => e.preventDefault());
  badge.addEventListener('click', () => {
    if (longFired) { longFired = false; return; }
    if (owner) openPanel();
  });

  // เจ้าของ: แจ้งเตือนถ้ามีข้อความรออนุมัติ
  if (owner && hasFB) {
    (async () => {
      try {
        const t = await getToken();
        if (!t) return;
        const [r, r2, r3] = await Promise.all([db('guestbook/pending', { token: t, q: 'shallow=true' }), db('inbox', { token: t, q: 'shallow=true' }), db('chat', { token: t })]);
        const n = r.ok ? Object.keys((await r.json()) || {}).length : 0;
        const n2 = r2.ok ? Object.keys((await r2.json()) || {}).length : 0;
        let n3 = 0;
        if (r3.ok) {
          const co = (await r3.json()) || {};
          n3 = Object.entries(co).filter(([uid, v]) => {
            const last = (v && v.meta && v.meta.last) || 0;
            return last > (+localStorage.getItem('chatSeen:' + uid) || 0);
          }).length;
        }
        if (n || n2 || n3) setTimeout(() => showToast(`มีข้อความใหม่: รออนุมัติ ${n} · ข้อความลับ ${n2} · แชท ${n3} (กดที่ป้ายสถานะ)`, 'star'), 1200);
      } catch (_) {}
    })();
  }
}
initSite();
initChat();
initClock();
initLive();

/* Scroll → update active nav */
const scrollSections = [
  { id: 'secGames', key: 'games' },
  { id: 'secGallery', key: 'gallery' },
];
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY + 140;
    let current = 'top';
    scrollSections.forEach(s => {
      const el = document.getElementById(s.id);
      if (el && el.offsetTop <= y) current = s.key;
    });
    $$('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.target === current);
    });
    ticking = false;
  });
}, { passive: true });
</script>
</body>
</html>
